[tox]
envlist = py3{11-13}
isolated_build = true
requires =
    tox-conda

[testenv]
setenv =
    CONDA_DLL_SEARCH_MODIFICATION_ENABLE = 1

conda_channels =
    conda-forge

conda_deps =
    pip
    rdkit 
    scikit-learn 
    jupyter 
    ca-certificates 
    certifi 
    openssl 
    matplotlib 
    ipywidgets 
    py3Dmol 
    pytest 
    mdtraj 
    pytest-cov 
    tqdm

commands =
    pip install .
    pytest
